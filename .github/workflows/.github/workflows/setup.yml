name: Set up Tampa Bay site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore reviewed site source
        run: |
          python3 - <<'PYCODE'
          import base64,gzip,json,pathlib
          files=json.loads(gzip.decompress(base64.b64decode('')))
          for name,content in files.items():
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          pathlib.Path('.github/workflows/setup.yml').unlink()
          PYCODE
      - run: npm install --no-audit --no-fund
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Tampa Bay connector site with sunset palm and ocean palette'
          git push
      - run: PREVIEW=1 npm run build && node scripts/preview.mjs
      - name: Publish static preview branch
        run: |
          cd dist
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build static Tampa Bay preview'
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
